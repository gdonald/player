[package]
name = "player-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
player-types.workspace = true
player-core.workspace = true
serde.workspace = true
serde_json.workspace = true
leptos = { version = "0.8", features = ["csr"] }
console_error_panic_hook = "0.1"
gloo-net = { version = "0.6", features = ["http", "json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
minicov = { version = "0.3", optional = true }
web-sys = { version = "0.3", features = [
    "AnalyserNode",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContext",
    "AudioContextState",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "AudioScheduledSourceNode",
    "BaseAudioContext",
    "BiquadFilterNode",
    "BiquadFilterType",
    "CanvasGradient",
    "CanvasRenderingContext2d",
    "CssStyleDeclaration",
    "DataTransfer",
    "DragEvent",
    "GainNode",
    "HtmlAudioElement",
    "HtmlCanvasElement",
    "HtmlMediaElement",
    "KeyboardEvent",
    "MediaElementAudioSourceNode",
    "MediaMetadata",
    "MediaMetadataInit",
    "MediaSession",
    "MediaSessionAction",
    "MediaSessionActionDetails",
    "MediaSessionPlaybackState",
    "Navigator",
    "Storage",
    "Window",
] }

[features]
# Instrumented build for measuring client coverage in the browser tests.
coverage = ["dep:minicov"]

# The workspace lints, with unsafe code denied instead of forbidden so the
# coverage build's one call into minicov can allow it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
